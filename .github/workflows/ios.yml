# iPhone-App bauen und zu TestFlight hochladen (IOS_PLAN.md). Läuft nur von Hand:
# Actions → „iPhone-App (TestFlight)“ → Run workflow. Kein eigener Mac nötig.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions → Secrets):
#   APPLE_TEAM_ID             Team-ID aus developer.apple.com → Mitgliedschaft (10 Zeichen)
#   ASC_KEY_ID                App Store Connect API: Schlüssel-ID
#   ASC_ISSUER_ID             App Store Connect API: Issuer-ID
#   ASC_PRIVATE_KEY           Inhalt der .p8-Datei (komplett, inkl. BEGIN/END-Zeilen)
name: iPhone-App (TestFlight)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac-Typ (bei Engpass „Apple-Chip“ den Intel-Mac wählen)'
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-15

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    # macos-15 = Apple-Chip (oft ausgelastet), macos-15-intel = Intel (laut GitHub bis Aug. 2027)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Secrets prüfen
        run: |
          missing=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Secrets:$missing (siehe Kopf dieser Datei)"; exit 1
          fi
      - uses: actions/checkout@v4
      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Zugangsdaten bei Apple prüfen
        run: node app/ios/ci/check-asc.mjs "$RUNNER_TEMP/asc/AuthKey.p8"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gewässerdaten wie im Pages-Workflow (Release „wasserdaten-*"); sie werden in die App gepackt.
      - name: Gewässerdaten holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("wasserdaten-"))][0].tagName // empty')
          if [ -z "$tag" ]; then echo "Keine Gewässerdaten-Release gefunden"; exit 0; fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'wasserdaten.tar.gz' --dir "$RUNNER_TEMP"
          mkdir -p app/public/data/water
          tar -xzf "$RUNNER_TEMP/wasserdaten.tar.gz" -C app/public/data/water
      - name: Web-App für die iPhone-App bauen
        run: pnpm -C app build:ios
        env:
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - name: Xcode wählen (neueste installierte Version)
        run: |
          xc=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc"
          xcodebuild -version
      # Archiv unsigniert bauen: eine Entwickler-Signatur bräuchte ein registriertes Testgerät. Signiert wird erst
      # beim Export für den App Store (Distribution, ohne Gerät) über den API-Schlüssel.
      - name: Archiv bauen
        run: |
          version=$(node -p "require('./app/package.json').version")
          xcodebuild archive \
            -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fangpunkt.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      # Das Archiv ist unsigniert und trägt deshalb keine Berechtigungen. Für Push-Mitteilungen (aps-environment)
      # bekommt die App vorläufig eine Ad-hoc-Signatur mit App.entitlements; der Export ersetzt sie durch die
      # App-Store-Signatur und übernimmt die Berechtigung (Xcode setzt dabei „production“ ein).
      - name: Berechtigungen ins Archiv
        run: |
          app="$RUNNER_TEMP/Fangpunkt.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements app/ios/App/App/App.entitlements "$app"
          codesign -d --entitlements - "$app"
      # Erst nur exportieren und die endgültigen Berechtigungen prüfen: fehlt „aps-environment“, kann sich kein
      # iPhone für Mitteilungen anmelden (Push Notifications für die App-ID im Apple-Entwicklerkonto einschalten).
      - name: Signierte App prüfen (Mitteilungen, Universal Links)
        run: |
          sed "s/TEAM_ID/$APPLE_TEAM_ID/; s#<string>upload</string>#<string>export</string>#" app/ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportCheck.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fangpunkt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportCheck.plist" \
            -exportPath "$RUNNER_TEMP/check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/check/ipa" && unzip -q "$RUNNER_TEMP"/check/*.ipa -d "$RUNNER_TEMP/check/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/check/ipa/Payload/*.app > "$RUNNER_TEMP/check/ent.plist" 2>/dev/null
          plutil -p "$RUNNER_TEMP/check/ent.plist"
          if ! grep -q "aps-environment" "$RUNNER_TEMP/check/ent.plist"; then
            echo "::error::Die signierte App hat keine Push-Berechtigung (aps-environment). Im Apple-Entwicklerkonto für com.fangpunkt.app „Push Notifications“ einschalten."
            exit 1
          fi
          grep -q "applinks:fangpunkt.com" "$RUNNER_TEMP/check/ent.plist" || echo "::warning::Universal Links (applinks:fangpunkt.com) fehlen in der signierten App."
      - name: Für den App Store signieren und zu TestFlight hochladen
        run: |
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" app/ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fangpunkt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
