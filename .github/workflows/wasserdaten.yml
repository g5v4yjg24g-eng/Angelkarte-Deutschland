# Gewässerdaten für ganz Deutschland erzeugen und als Release „wasserdaten-*" veröffentlichen
# (tools/water-pipeline, ARCHITECTURE §6.1). Daten © OpenStreetMap-Mitwirkende, ODbL 1.0.
# Start: Actions → „Gewässerdaten erzeugen" → Run workflow, oder einen Branch „datenlauf/<datum>" pushen.
# Der Pages-Workflow holt beim nächsten Bauen automatisch das neueste Release.
name: Gewässerdaten erzeugen

on:
  workflow_dispatch:
  push:
    branches: ['datenlauf/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: wasserdaten
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: echo "WORK=$RUNNER_TEMP/wasser" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential libsqlite3-dev zlib1g-dev
          # tippecanoe aus Ubuntu (2.49) ist ungeeignet: verliert Objekte, vertauscht IDs (DATA_SOURCES §10.4)
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)" tippecanoe tippecanoe-decode
          "$RUNNER_TEMP/tippecanoe/tippecanoe" --version
          df -h "$RUNNER_TEMP"

      - name: Deutschland-Auszug laden (MD5 geprüft)
        run: |
          mkdir -p "$WORK"
          cd "$WORK"
          # Geofabrik zuerst, openstreetmap.fr als Ersatz. Ein Abruf ohne Datenfluss (< 100 KB/s über 2 min)
          # bricht ab, statt bis zum Job-Zeitlimit zu hängen.
          for url in https://download.geofabrik.de/europe/germany-latest.osm.pbf \
                     https://download.openstreetmap.fr/extracts/europe/germany.osm.pbf; do
            name=$(basename "$url")
            if curl -sS --fail --retry 3 --retry-delay 30 --connect-timeout 60 \
                 --speed-limit 100000 --speed-time 120 -o "$name" "$url" \
               && curl -sS --fail --retry 3 --connect-timeout 60 --max-time 120 -o "$name.md5" "$url.md5" \
               && md5sum -c "$name.md5"; then
              [ "$name" = germany.osm.pbf ] || mv "$name" germany.osm.pbf
              echo "EXTRACT_URL=$url" >> "$GITHUB_ENV"
              ls -la germany.osm.pbf
              exit 0
            fi
            echo "::warning::Abruf von $url fehlgeschlagen"
            rm -f "$name" "$name.md5"
          done
          exit 1

      - name: Pipeline (inkl. Grenzgewässer über Overpass und Prüfung jedes Objekts)
        working-directory: tools/water-pipeline
        run: TIPPECANOE_DIR="$RUNNER_TEMP/tippecanoe" bash run.sh "$WORK/germany.osm.pbf" "$WORK/out"

      - name: Stichprobe WAT-2 (20 bekannte Gewässer)
        working-directory: tools/water-pipeline
        run: node --import tsx src/sample.ts "$WORK/out" | tee "$WORK/out/stichprobe.txt"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$WORK/out"
          tar -czf wasserdaten.tar.gz water.pmtiles water-manifest.json states.json search
          date=$(jq -r '.dataDate[0:10]' water-manifest.json)
          tag="wasserdaten-$date-$GITHUB_RUN_NUMBER"
          {
            echo "Gewässerdaten für Deutschland, Datenstand $(jq -r .dataDate water-manifest.json)."
            echo
            echo "Daten © OpenStreetMap-Mitwirkende, lizenziert unter der Open Database License (ODbL) 1.0."
            echo "Quelle: $EXTRACT_URL. $(jq -r '.source.supplement // ""' water-manifest.json)"
            echo "Erzeugt mit tools/water-pipeline (Commit $GITHUB_SHA)."
            echo
            echo '```'
            jq '{waters: .waters | {total, areas, lines, degenerate}, search: .search | {entries, gzipBytes}}' report.json
            cat stichprobe.txt
            echo '```'
          } > notes.md
          gh release create "$tag" wasserdaten.tar.gz report.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Gewässerdaten $date" --notes-file notes.md
          ls -la wasserdaten.tar.gz

      - name: Vorschau neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
