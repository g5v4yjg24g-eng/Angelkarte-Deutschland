name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Gepinnt: Playwright 1.56 (passend zum lokalen Chromium) unterstützt Ubuntu 26.04 (ubuntu-latest) nicht.
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Playwright-Browser installieren
        run: pnpm -C app exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ergebnisse
          path: app/test-results
          retention-days: 7
