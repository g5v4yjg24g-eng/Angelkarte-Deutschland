# Vorschau auf GitHub Pages (für Gerätetests). Läuft nur, wenn Pages im Repo auf
# „Source: GitHub Actions" steht (Settings → Pages).
name: Vorschau (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gewässerdaten (ODbL) liegen als Anhang des neuesten Releases „wasserdaten-*" (erzeugt mit tools/water-pipeline).
      # Fehlen sie, wird die App ohne Gewässerebene gebaut – die übrige App funktioniert trotzdem.
      - name: Gewässerdaten holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("wasserdaten-"))][0].tagName // empty')
          if [ -z "$tag" ]; then echo "Keine Gewässerdaten-Release gefunden"; exit 0; fi
          echo "Verwende $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'wasserdaten.tar.gz' --dir /tmp
          mkdir -p app/public/data/water
          tar -xzf /tmp/wasserdaten.tar.gz -C app/public/data/water
          ls -la app/public/data/water
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Anonyme Nutzungszählung (GoatCounter): Code als Repository-Variable (Settings → Secrets and variables →
          # Actions → Variables → GOATCOUNTER_CODE). Leer = es wird nichts gezählt.
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
