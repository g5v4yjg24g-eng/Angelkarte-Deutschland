<!doctype html>
<!--
  Fangpunkt – Werbevideo, HyperFrames-Fassung (Hochformat 1080 × 1920, 42 s).
  Szenen in compositions/, Medien in assets/ (gemeinsam mit dem Remotion-Projekt, Verweis ../assets).
  Texte, Farben und Ziel-URL sind Variablen (HyperFrames-App → Variables).
-->
<html
  lang="de"
  data-composition-variables='[
    {"id":"color-deep","type":"color","label":"Tiefblau","default":"#0B2A33"},
    {"id":"color-primary","type":"color","label":"Petrol","default":"#0F5C6E"},
    {"id":"color-ripple","type":"color","label":"Türkis","default":"#5CC4D6"},
    {"id":"color-accent","type":"color","label":"Akzent Orange","default":"#F2994A"},
    {"id":"color-fish","type":"color","label":"Fischweiß","default":"#E8F4F5"}

>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-deep: #0b2a33;
        --color-primary: #0f5c6e;
        --color-ripple: #5cc4d6;
        --color-accent: #f2994a;
        --color-fish: #e8f4f5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-deep);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-deep);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <!-- Szene 1 – Leidenschaft: Angler am nebligen See -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- Szene 2+3 – App entdecken und Funktionen (ein Handy, das stillsteht) -->
      <div
        id="app"
        data-composition-id="app"
        data-composition-src="compositions/app.html"
        data-start="4.4"
        data-duration="19.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- Lichteinfall als Übergang in den Fangmoment -->
      <div
        id="organic-light-leak-overlay"
        data-composition-id="organic-light-leak-overlay"
        data-composition-src="compositions/organic-light-leak-overlay.html"
        data-start="22.9"
        data-duration="1.6"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>

      <!-- Szene 4 – Fangmoment: Steg im Nebel, Fisch wird zurückgesetzt, echter Fangbuch-Eintrag -->
      <div
        id="story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="23.5"
        data-duration="6.8"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
