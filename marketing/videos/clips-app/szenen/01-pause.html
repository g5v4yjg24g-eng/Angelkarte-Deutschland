<!doctype html>
<!--
  Clip trifft App 01 „Pause“: oben die Steg-Aufnahme des Nutzers (assets/steg-pause.mp4, Ausschnitt wie clips-steg 03),
  unten das Handy mit der echten App (assets/app-pause.mp4 aus tools/record-pause.mjs, Beispieldaten).
  Zeiten der App-Aufnahme: assets/app-pause.json; im Video um R = 2,4 s versetzt (Pause 3,9 s, +15 min 6,52 s, Weiter 7,72 s).
  Rendern: siehe ../README.md
-->
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('assets/fonts/fraunces-latin-wght-normal.woff2') format('woff2');
      }
      :root {
        --deep: #0b2a33;
        --fish: #e8f4f5;
        --eye: #f2994a;
        --ripple: #5cc4d6;
        --muted: #d6e8eb;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--deep);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: 'Inter', sans-serif;
        color: var(--fish);
        background: radial-gradient(120% 70% at 80% 100%, #145a6a 0%, var(--deep) 55%, #071d24 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Obere Hälfte: Steg-Aufnahme, unten weich in den dunklen Grund auslaufend */
      #footage {
        bottom: auto;
        width: 1080px;
        height: 1000px;
        object-fit: cover;
        object-position: 50% 32.6%;
        -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
      }
      #shade {
        bottom: auto;
        height: 1000px;
        background: linear-gradient(180deg, rgb(7 29 36 / 0.7) 0%, rgb(7 29 36 / 0.3) 24%, rgb(7 29 36 / 0) 40%);
      }
      .kicker {
        top: 96px;
        bottom: auto;
        left: 84px;
        right: 84px;
        font: 700 30px/1 'Inter', sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ripple);
        opacity: 0;
      }
      .title {
        top: 140px;
        bottom: auto;
        left: 84px;
        right: 84px;
        font: 650 96px/1.04 'Fraunces', serif;
        letter-spacing: -0.01em;
        opacity: 0;
        text-shadow: 0 4px 24px rgb(0 0 0 / 0.25);
      }
      .title em,
      .end-title em {
        font-style: normal;
        color: var(--eye);
      }
      .sub {
        top: 260px;
        bottom: auto;
        left: 84px;
        right: 84px;
        font: 500 42px/1.3 'Inter', sans-serif;
        color: var(--muted);
        opacity: 0;
        text-shadow: 0 2px 16px rgb(0 0 0 / 0.35);
      }
      /* Handy unten, ragt über den Bildrand hinaus */
      #phone {
        position: absolute;
        left: 240px;
        top: 900px;
        width: 600px;
        height: 1261px;
        padding: 16px;
        border-radius: 76px;
        background: #05161b;
        box-shadow:
          0 40px 90px rgb(0 0 0 / 0.5),
          0 0 0 2px rgb(92 196 214 / 0.3);
        opacity: 0;
      }
      #phone .screen {
        position: relative;
        width: 568px;
        height: 1229px;
        border-radius: 60px;
        overflow: hidden;
        background: #05161b;
        isolation: isolate;
      }
      #phone img,
      #phone video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Rahmen um die Zeile „Angelzeit“ (App-Zeile bei 288 CSS-px × 568/390) */
      #ring {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 389px;
        height: 60px;
        border: 5px solid var(--eye);
        border-radius: 16px;
        box-shadow: 0 0 0 9999px rgb(5 22 27 / 0.28);
        opacity: 0;
      }
      /* Hinweis-Kapseln zwischen Aufnahme und Handy */
      .pill {
        position: absolute;
        top: 800px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        opacity: 0;
      }
      .pill span {
        font: 700 40px/1 'Inter', sans-serif;
        padding: 22px 34px;
        border-radius: 999px;
        background: rgb(5 22 27 / 0.82);
        border: 2px solid rgb(92 196 214 / 0.5);
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.35);
      }
      .pill span b {
        color: var(--eye);
        font-weight: 800;
      }
      .end {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        background: radial-gradient(120% 80% at 80% 0%, #145a6a 0%, var(--deep) 55%, #071d24 100%);
      }
      .end img {
        width: 300px;
        height: 300px;
      }
      .end .brand {
        margin-top: 6px;
        font: 650 72px/1 'Fraunces', serif;
      }
      .end .end-title {
        margin-top: 60px;
        font: 650 104px/1.04 'Fraunces', serif;
      }
      .end .tag {
        margin-top: 40px;
        font: 600 34px/1 'Inter', sans-serif;
        padding: 20px 32px;
        border-radius: 999px;
        background: rgb(92 196 214 / 0.14);
        border: 1.5px solid rgb(92 196 214 / 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.6" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/steg-pause.mp4" data-has-audio="true" data-volume="0.6"
        data-fade-in="0.3" data-fade-out="0.6" data-start="0" data-duration="11" data-media-start="0"
        data-track-index="0"></video>
      <div id="shade" class="clip" data-start="0" data-duration="11" data-track-index="1"></div>
      <div id="kicker" class="clip kicker" data-start="0" data-duration="11" data-track-index="2">Session-Pausen</div>
      <div id="title" class="clip title" data-start="0" data-duration="11" data-track-index="3">Kurz <em>hinsetzen</em>.</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="11" data-track-index="4">Die Pause zählt nicht als Angelzeit.</div>

      <div id="phone">
        <div class="screen">
          <img src="assets/app-pause-start.png" alt="" />
          <video id="app-video" src="assets/app-pause.mp4" muted data-start="2.4" data-duration="7.91"></video>
          <div id="ring"></div>
        </div>
      </div>

      <div id="p1" class="pill"><span>„Pause“ tippen</span></div>
      <div id="p2" class="pill"><span>15 Minuten später …</span></div>
      <div id="p3" class="pill"><span>„Weiter angeln“</span></div>
      <div id="p4" class="pill"><span>Angelzeit bleibt bei <b>1 h 12 min</b></span></div>

      <div id="end" class="clip end" data-start="10.7" data-duration="2.9" data-track-index="6">
        <img src="assets/fisch.svg" alt="" />
        <div class="brand">Fangpunkt</div>
        <div class="end-title">Link in der <em>Bio</em></div>
        <div class="tag">Kostenlos · ohne Konto</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pillIn = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 18, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, at);
      const pillOut = (sel, at) => tl.to(sel, { opacity: 0, y: -12, duration: 0.22, ease: 'power2.in' }, at);

      tl.fromTo('#footage', { scale: 1 }, { scale: 1.05, duration: 11, ease: 'none', transformOrigin: '50% 40%' }, 0);
      tl.fromTo('#kicker', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.4);
      tl.fromTo('#title', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.55);
      tl.fromTo('#sub', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.3);
      // Handy kommt hoch, App-Aufnahme beginnt bei 2,4 s
      tl.fromTo('#phone', { opacity: 0, y: 220 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 1.5);
      // Tipp auf „Pause“ bei 3,9 s
      pillIn('#p1', 3.55);
      pillOut('#p1', 6.2);
      // Uhr springt bei 6,52 s um 15 Minuten
      pillIn('#p2', 6.4);
      pillOut('#p2', 7.45);
      // Tipp auf „Weiter angeln“ bei 7,72 s
      pillIn('#p3', 7.5);
      pillOut('#p3', 8.55);
      pillIn('#p4', 8.65);
      tl.fromTo('#ring', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, 8.65);
      // Schluss
      tl.to(['#kicker', '#title', '#sub', '#p4'], { opacity: 0, y: -16, duration: 0.3, ease: 'power2.in' }, 10.4);
      tl.to('#phone', { opacity: 0, y: 120, duration: 0.35, ease: 'power2.in' }, 10.4);
      tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.7);
      tl.fromTo('#end img', { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 10.8);
      tl.fromTo('#end .end-title', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 11.25);
      tl.fromTo('#end .tag', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.55);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
